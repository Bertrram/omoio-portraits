[package]
name = "omoio-portraits"
version = "0.2.0"
edition = "2021"
description = "Reads the figure pictures out of the user's own copy of Skylanders SWAP Force or Trap Team, for Omoio's portal menu."
publish = false

[dependencies]
# Cemu's .wua keeps the game's files in zstd blocks.
zstd = "0.13"
# The game's own archives store files as raw deflate.
flate2 = "1"
# Skylanders Giants on the PS3 packs its archives with LZMA instead. Its
# default features add other formats and unsafe speed-ups, none needed here.
lzma-rust2 = { version = "0.20", default-features = false, features = ["std"] }
# The pictures are written as PNG for Omoio to show.
png = "0.18"

[dev-dependencies]
# The tests pack chunks the way Giants does, to read them back.
lzma-rust2 = { version = "0.20", default-features = false, features = ["std", "encoder"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
